name: Campus Companion CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The login demo is intentionally available only on the staging project
      # identity. This is a fake key: the anonymous-demo firewall asserts that
      # no REST, Functions, Storage, or Realtime request reaches that project.
      VITE_SUPABASE_URL: https://dfpgnmldxphkfmobjbvr.supabase.co
      VITE_SUPABASE_PROJECT_ID: dfpgnmldxphkfmobjbvr
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci-placeholder
      VITE_PUBLIC_SIGNUPS_ENABLED: "false"
      VITE_PASSKEYS_ENABLED: "false"
      VITE_RELEASE_SHA: ${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Desktop, Android, and iPhone journey smoke tests
        run: npm run e2e

      - name: Upload failed journey evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
